services:
  custom_formatters.devel_generate_integration:
    class: Drupal\custom_formatters\DevelGenerateIntegration
    arguments:
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@module_handler'
  custom_formatters.dependency_builder:
    class: Drupal\custom_formatters\FormatterDependencyBuilder
    arguments:
      - '@plugin.manager.field.field_type'
      - '@plugin.manager.custom_formatters.formatter_type'
      - '@plugin.manager.custom_formatters.formatter_extras'
      - '@config.manager'
      - '@entity_type.manager'
      - '@config.factory'
  plugin.manager.custom_formatters.formatter_extras:
    class: Drupal\custom_formatters\FormatterExtrasManager
    parent: default_plugin_manager
  plugin.manager.custom_formatters.formatter_type:
    class: Drupal\custom_formatters\FormatterTypeManager
    parent: default_plugin_manager
